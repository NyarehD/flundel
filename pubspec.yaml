name: flundel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  easy_localization: ^3.0.8
  go_router: ^18.0.1
  auto_mappr_annotation: ^2.0.0
  just_audio: ^0.10.6
  flutter_soloud: ^2.0.0
  vibration: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  auto_mappr: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/audio/
    - assets/audio/piano/
    - assets/audio/pads/
    - assets/audio/nature/
    - assets/audio/completion/
    - assets/audio/textures/
